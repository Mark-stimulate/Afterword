name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check brand spelling
        run: |
          brand_status=0
          git grep -n 'After[W]ord' || brand_status=$?
          test "$brand_status" -eq 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build:community
