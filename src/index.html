<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>拾语 · Afterword｜让对话继续</title><link rel="stylesheet" href="style.css"></head><body>
<div id="sidebarBackdrop" hidden></div><aside id="sidebar"><div class="sidebar-top"><a class="brand" href="/" aria-label="拾语 · Afterword"><span class="logo">拾</span><span>拾语<small>· Afterword</small></span></a><button id="closeSidebar" type="button" aria-label="收起侧边栏">✕ <span>收起</span></button></div><button class="primary" id="newChat">＋ 开始新对话</button><div class="navlabel">我的对话 <span id="count">0</span></div><input id="search" placeholder="搜索对话标题" aria-label="搜索对话标题"><label class="search-option"><input type="checkbox" id="fullSearch"> 搜索正文与记忆 <span>PRO</span></label><nav id="conversations"></nav><div class="sidebottom"><button id="libraryBtn">♧ 记忆模板库</button><button id="importBtn">↥ 导入对话</button><button id="manageBtn">⚙ 设置与管理</button><div class="localnote"><i></i> 本地优先 · 数据由你保管<small>测试版 0.2.0 · 第三方独立工具</small></div></div></aside>
<main><header><div><button id="menu" aria-label="打开侧边栏" aria-controls="sidebar" aria-expanded="false">☰</button><span id="chatTitle">新的篇章</span></div><div class="headeractions"><button id="quickTheme" title="颜色与阅读">◐ 氛围</button><span class="badge" id="connection">未连接 API</span><button id="memoryBtn">◇ 记忆卡</button><button id="deleteBtn" title="删除当前对话">删除</button></div></header><div id="chatScroll"><section id="welcome"><div class="eyebrow">A LITTLE SPACE, JUST FOR YOU</div><h1>在这一页，<br><em>安放心里的话。</em></h1><p>选一种喜欢的颜色，让文字慢下来。<br>带着故事与记忆，继续属于你的篇章。</p><div class="featuregrid"><button id="welcomeImport"><span>01 / BRING IT HERE</span><b>带来一段对话 ↗</b><small>导入记录，延续未完的故事</small></button><button id="demoBtn"><span>02 / TAKE A LOOK</span><b>先看看示例 ↗</b><small>无需 Key，体验记忆和本地保存</small></button></div><div class="privacyline">◉ 无账号 · 无广告统计 · API Key 由你提供</div></section><section id="messages" aria-live="polite"></section></div><footer><div id="contextLine">发送时会将当前消息、近期对话和启用的记忆发送至 DeepSeek。</div><form id="composer"><textarea id="prompt" rows="2" placeholder="此刻，想说些什么…" aria-label="输入消息" maxlength="50000"></textarea><div class="composerbottom"><button type="button" id="previewBtn">↗ 查看发送内容</button><div><span class="modeltag">DeepSeek · Flash</span><button id="sendBtn" class="send" type="submit">发送 ↑</button><button id="stopBtn" type="button" hidden>停止</button></div></div></form><div class="footnote">AI 生成内容可能不准确。API 单独计费；本地数据请定期备份。</div></footer></main>
<div hidden><button id="appearanceBtn"></button><button id="licenseBtn"></button><button id="backupBtn"></button><button id="settingsBtn"></button><button id="guideBtn"></button></div><dialog id="dialog"><div class="dialoghead"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭">✕</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status" hidden></div><script type="module" src="app.js"></script></body></html>
